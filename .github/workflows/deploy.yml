name: Deploy Bambiboo to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/bambiboo_key
          chmod 600 ~/.ssh/bambiboo_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT }}" "${{ secrets.HOSTINGER_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare Hostinger directory
        run: |
          ssh \
            -i ~/.ssh/bambiboo_key \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "mkdir -p ~/bambiboo-app"

      - name: Deploy Nitro output
        run: |
          scp -r \
            -i ~/.ssh/bambiboo_key \
            -P "${{ secrets.HOSTINGER_PORT }}" \
            .output \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:~/bambiboo-app/"

      - name: Verify deployment
        run: |
          ssh \
            -i ~/.ssh/bambiboo_key \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "ls -lah ~/bambiboo-app/.output/server/index.mjs"
