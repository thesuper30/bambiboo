name: Bambiboo Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inspect Nitro output
        run: |
          echo "=== OUTPUT ==="
          ls -lah .output
          echo "=== OUTPUT FILES ==="
          find .output -maxdepth 3 -type f | head -100

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bambiboo-build
          path: .output
